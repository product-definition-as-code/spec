name: Conformance

# Drift is introduced by editing a fixture in this repository, so the check runs here, on the
# pull request that introduces it, rather than downstream of the merge that already accepted it.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  digests:
    name: pinned digests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      # Pinned exactly, not by range. This job decides whether the conformance tests are sound, so
      # the tool deciding it must not change under the repository: green tests that go red without a
      # spec change would be indistinguishable from real drift. Bump this deliberately.
      #
      # A failure here is a defect in this repository, unlike pdac-conformance's own conformance job, where
      # a failing case is a verdict about an implementation. So this one fails the build.
      - name: verify the digests the conformance tests pin
        run: >-
          npx --yes pdac-conformance@1.0.0 digests --spec .
          --spec-version 0.2.0 --serialization-version v1alpha1
      - name: keep the digest schema description aligned with the raw-byte contract
        run: >-
          node -e "const fs = require('node:fs');
          const schema = JSON.parse(fs.readFileSync('schemas/v1alpha1/common.schema.json', 'utf8'));
          const validation = fs.readFileSync('spec/validation.md', 'utf8');
          const expected = 'SHA-256 over raw file bytes after CRLF and CR byte-sequence normalization to LF; bytes are never decoded or BOM-stripped.';
          if (schema['\$defs'].digest.description !== expected || !validation.includes('raw bytes') || !validation.includes('MUST NOT decode content before hashing') || !validation.includes('MUST NOT strip a byte order mark')) process.exit(1);"

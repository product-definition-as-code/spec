name: Notify site

# pdac.dev builds its spec pages by checking out this repository and running its sync script, so a
# merge here changes what the site should serve while changing nothing in the site's own repository.
# Nothing then triggers a rebuild, and the site serves stale normative text until somebody
# remembers. That happened across the RFC 0022 release. This closes it.
#
# The site's deploy workflow already listens for `repository_dispatch: spec-updated`; this is the
# sender half.

on:
  push:
    branches: [main]
    # Only what the site actually reads: the chapters, the manifesto and the diagrams. A change to
    # the corpus, the RFCs or this workflow does not reach a page, so it does not spend a rebuild.
    paths:
      - 'spec/**'
      - 'MANIFESTO.md'
      - 'assets/diagrams/**'
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    name: ask pdac.dev to rebuild
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN is scoped to this repository and cannot dispatch to another one, so this needs
      # a token of its own: a fine-grained PAT with Contents write on the site repository, stored
      # here as SITE_DISPATCH_TOKEN.
      #
      # A missing token fails the job rather than skipping quietly. A notification that silently
      # does nothing is precisely the failure this workflow exists to remove.
      - name: dispatch
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SITE_DISPATCH_TOKEN is not set. Create a fine-grained PAT with Contents: write on product-definition-as-code/product-definition-as-code.github.io and add it as a repository secret."
            exit 1
          fi
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/product-definition-as-code/product-definition-as-code.github.io/dispatches \
            -d "{\"event_type\":\"spec-updated\",\"client_payload\":{\"revision\":\"${GITHUB_SHA}\"}}")
          # 204 is the only success the dispatch API returns. Anything else, including a 200 with a
          # body, means the event was not accepted, and a rebuild nobody requested is the bug.
          if [ "$code" != "204" ]; then
            echo "::error::dispatch was not accepted (HTTP $code)"
            cat response.txt
            exit 1
          fi
          echo "spec-updated dispatched for ${GITHUB_SHA}"
          echo "### Asked pdac.dev to rebuild for \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
